<style>
:root{--bg:#EDF2EF;--ink:#0E2520;--muted:#586D67;--accent:#0A6B58}
@media (prefers-color-scheme:dark){:root{--bg:#0B1916;--ink:#E6F1ED;--muted:#93ABA3;--accent:#5FD3B5}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:18px/1.55 Georgia,serif;padding:16px;text-align:center}
h1{font:800 clamp(3rem,12vw,7rem)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.04em;margin:0 0 8px}
p{color:var(--muted);margin:0 0 20px}
a{color:var(--accent);font-weight:700}
</style>
<script>
/* GitHub Pages tidak punya rewrite. Alamat dinamis seperti /entri/xxx jatuh ke sini,
   lalu halaman /entri/ atau /profil/ dimuat dan membaca bagian akhir alamat. */
(function(){
  var p=location.pathname,m=p.match(/^\/(entri|profil)\/[^\/]+\/?$/);
  if(m){
    fetch("/"+m[1]+"/").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){
      document.open();document.write(h);document.close();
    }).catch(function(){});
    return;
  }
  var old=p.match(/^\/(entri|profil|kontributor)\.html$/);
  if(old){
    var k=decodeURIComponent((location.hash||"").slice(1));
    location.replace(old[1]==="kontributor"?"/kontributor/":"/"+old[1]+"/"+(k?encodeURIComponent(k):""));
  }
})();
</script>

  <h1>404</h1>
  <p>Halaman ini tidak ada atau sudah dipindahkan.</p>
